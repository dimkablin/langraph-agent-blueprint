name: langgraph-agent-blueprint-local

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3002
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
  SALT: "local-langfuse-salt-change-me"
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_USE_AZURE_BLOB: "false"
  LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
  LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
  LANGFUSE_S3_BATCH_EXPORT_REGION: auto
  LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: minio
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: local-redis-password
  REDIS_TLS_ENABLED: "false"
  EMAIL_FROM_ADDRESS: local@example.invalid
  SMTP_CONNECTION_URL: ""

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: langgraph-agent-blueprint-backend:local
    env_file:
      - .env
    environment:
      # Docker-only override: keep runtime storage inside the app_storage volume.
      CC_LANGGRAPH_STORAGE_DIR: /app/.storage
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      LANGFUSE_ENABLED: "true"
      LANGFUSE_PUBLIC_KEY: pk-lf-local-langgraph-agent-blueprint
      LANGFUSE_SECRET_KEY: sk-lf-local-langgraph-agent-blueprint
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_ENVIRONMENT: local-docker
      LANGFUSE_RELEASE: local-compose
      LANGFUSE_TRACE_USER_ID: local-tester
      LANGFUSE_CAPTURE_INPUTS: "true"
      LANGFUSE_CAPTURE_OUTPUTS: "true"
      LANGFUSE_INCLUDE_PROJECT_PATHS: "false"
      LANGFUSE_RUNTIME_EVENTS_MODE: high_signal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_storage:/app/.storage
      - type: bind
        source: ${LOCAL_PROJECTS_DIR:-./mounted-projects}
        target: /workspace
    depends_on:
      langfuse-web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/commands', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.local
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    image: langgraph-agent-blueprint-frontend:local
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3.178.0
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      <<: *langfuse-env

  langfuse-web:
    image: docker.io/langfuse/langfuse:3.178.0
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: local-nextauth-secret-change-me
      LANGFUSE_INIT_ORG_ID: local-org
      LANGFUSE_INIT_ORG_NAME: Local Org
      LANGFUSE_INIT_PROJECT_ID: local-project
      LANGFUSE_INIT_PROJECT_NAME: langgraph-agent-blueprint local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local-langgraph-agent-blueprint
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local-langgraph-agent-blueprint
      LANGFUSE_INIT_USER_EMAIL: local@example.invalid
      LANGFUSE_INIT_USER_NAME: Local Tester
      LANGFUSE_INIT_USER_PASSWORD: local-langfuse-password
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://langfuse-web:3000/api/public/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-create-bucket:
    image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >-
      -c "mc alias set local http://minio:9000 minio miniosecret &&
      mc mb --ignore-existing local/langfuse"
    restart: "no"

  redis:
    image: docker.io/redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "local-redis-password", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a local-redis-password ping | grep PONG"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  app_storage:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
