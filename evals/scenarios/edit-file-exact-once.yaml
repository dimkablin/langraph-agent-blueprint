id: edit-file-exact-once
description: edit_file should succeed after a prior read when snippet is exact once and approved.
provider: fake
workspace_fixture: basic_repo
steps:
  - input:
      text: 'tool:read_file {"path":"notes.txt"}'
    expect:
      tool_calls:
        - name: read_file
          status: ok
  - input:
      text: 'tool:edit_file {"path":"notes.txt","old_text":"unique","new_text":"changed"}'
      approve: true
    expect:
      tool_calls:
        - name: edit_file
          status: ok
      files:
        - path: notes.txt
          exists: true
          contains:
            - changed
          not_contains:
            - unique
