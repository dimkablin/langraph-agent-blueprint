[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-agent-blueprint"
version = "0.1.0"
description = "Reference implementation of a production-style agent runtime built with Python and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "langchain-core",
  "pydantic>=2",
  "typer",
  "rich",
  "httpx",
  "pyyaml",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
openai = ["langchain-openai"]
ollama = ["langchain-ollama"]
anthropic = ["langchain-anthropic"]
observability = ["langfuse>=3"]
test = ["pytest"]

[project.scripts]
lg-agent = "langgraph_agent_blueprint.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langgraph_agent_blueprint = ["skills/definitions/*/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
  "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14 or greater.:UserWarning",
]
